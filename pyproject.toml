[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uptime-guard"
version = "0.1.0"
description = "Async uptime monitoring service with Telegram bot"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    # Validation & Config
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    # HTTP client (for health checks + Telegram API)
    "httpx>=0.27,<1.0",
    # Redis
    "redis>=5.0,<6.0",
    # Observability
    "prometheus-client>=0.21,<1.0",
    "structlog>=24.0",
    # Telegram bot
    "python-telegram-bot>=21.0,<22.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",           # уже в основных, но нужен для TestClient
    "sqlalchemy[mypy]",
]

# ──────────────────────────────────────────────
# Ruff — линтер + форматтер (замена flake8+black+isort)
# ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src/uptime_guard"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (сортировка импортов)
    "UP",   # pyupgrade (модернизация синтаксиса)
    "B",    # bugbear (частые баги)
    "SIM",  # simplify (упрощение кода)
    "N",    # pep8-naming
]
ignore = [
    "E501",  # line too long — пусть форматтер решает
    "UP046", # generic class syntax
]

[tool.ruff.lint.isort]
known-first-party = ["uptime_guard"]

# ──────────────────────────────────────────────
# MyPy — статический анализ типов
# ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Для сторонних библиотек без стабов
warn_return_any = true
warn_unused_configs = true

ignore_missing_imports = true


# ──────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ──────────────────────────────────────────────
# Setuptools — какие пакеты искать
# ──────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]
include = ["uptime_guard*"]

